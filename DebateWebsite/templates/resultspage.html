     async function videoDetails(vid_id){

        const apiCall = `https://www.googleapis.com/youtube/v3/videos?id=${vid_id}&part=snippet,contentDetails,statistics&key=${apiKey}`;

        try{

            var response = await fetch(apiCall);
            if(!response.ok){
                throw new Error("Network status isn't okay " + response.statusText);
            }
            const video = await response.json();
            return video.items[0].snippet.title;//console.log(video.items[0].snippet.title);
            /*var newtieritem = document.createElement("li");
